[package]
name = "prompt-library"
version = "0.1.0"
description = "Local prompt library, template filler and LLM prompt enhancer"
authors = ["bosscube1"]
license = "MIT"
repository = "https://github.com/bosscube1/prompt-helper"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "prompt_library_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"

# Shrink the shipped binary — the installer is the deliverable here.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
